<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curling / Shuffleboard Overlay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@500;700&display=swap">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Fredoka', 'Rubik', sans-serif;
            user-select: none;
        }

        #curling-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            pointer-events: none;
        }

        #ws-status {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            color: #fff;
            background: #c0392b;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 9999;
        }

        #ws-status.connected {
            background: #27ae60;
        }

        #ws-status.hidden {
            opacity: 0;
        }
    </style>
    <script>
        try {
            if (((window.parent && window.parent !== window) || new URLSearchParams(window.location.search).get('shared') === '1') && !window.__overlayCompositorHub) {
                var s = document.createElement('style');
                s.textContent = '#ws-status, #counter-status, #timer-status { display: none !important; }';
                document.head.appendChild(s);
            }
        } catch (_) {}
    </script>
</head>
<body>
    <div id="ws-status" data-overlay="Curling / Shuffleboard">Disconnected</div>
    <canvas id="curling-canvas"></canvas>

    <script src="/js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script>
        const cacheBust = new URLSearchParams(window.location.search).get('_cb') || Date.now().toString();
        const scripts = [
            '/js/ws-client.js',
            '/js/ws-status.js',
            '/js/drop-games-common.js',
            '/js/drop-games-audio.js',
            '/js/curling.js'
        ];
        function loadScripts(list, index) {
            if (index >= list.length) return;
            const s = document.createElement('script');
            s.src = list[index] + '?v=' + encodeURIComponent(cacheBust);
            s.onload = s.onerror = function () {
                loadScripts(list, index + 1);
            };
            document.head.appendChild(s);
        }
        loadScripts(scripts, 0);
    </script>
</body>
</html>
