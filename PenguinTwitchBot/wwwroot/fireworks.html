<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Firework Simulator v2</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#000000">
	<link rel="shortcut icon" type="image/png"
		href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
	<link rel="icon" type="image/png"
		href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
	<link rel="apple-touch-icon-precomposed"
		href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
	<meta name="msapplication-TileColor" content="#000000">
	<meta name="msapplication-TileImage"
		content="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
	<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">


	<style>
		* {
			position: relative;
			box-sizing: border-box;
			background-color: transparent !important;
		}

		html,
		body {
			height: 100%;
		}

		body {
			overflow: hidden;
			color: rgba(255, 255, 255, 0.5);
			font-family: "Russo One", arial, sans-serif;
			line-height: 1.25;
			letter-spacing: 0.06em;
		}

		.remove {
			display: none !important;
		}

		.container {
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.loading-init {
			width: 100%;
			align-self: center;
			text-align: center;
			text-transform: uppercase;
		}

		.loading-init__header {
			font-size: 2.2em;
		}

		.loading-init__status {
			margin-top: 1em;
			font-size: 0.8em;
			opacity: 0.75;
		}

		.stage-container {
			overflow: hidden;
			box-sizing: initial;
			border: 1px solid #222;
			margin: -1px;
		}

		@media (max-width: 840px) {
			.stage-container {
				border: none;
				margin: 0;
			}
		}

		.canvas-container {
			width: 100%;
			height: 100%;
			transition: filter 0.3s;
		}

		.canvas-container canvas {
			position: absolute;
			mix-blend-mode: lighten;
			transform: translateZ(0);
		}

		#ws-status {
			position: fixed;
			top: 12px;
			left: 50%;
			transform: translateX(-50%);
			padding: 6px 14px;
			border-radius: 6px;
			font-size: 0.85em;
			font-weight: bold;
			color: #fff !important;
			background: #c0392b !important;
			opacity: 1;
			transition: opacity 0.6s ease;
			pointer-events: none;
			z-index: 9999;
		}

		#ws-status.connected {
			background: #27ae60 !important;
		}

		#ws-status.hidden {
			opacity: 0;
		}
	</style>
	<script>
		try {
			if (((window.parent && window.parent !== window) || new URLSearchParams(window.location.search).get('shared') === '1') && !window.__overlayCompositorHub) {
				var s = document.createElement('style');
				s.textContent = '#ws-status, #counter-status, #timer-status { display: none !important; }';
				document.head.appendChild(s);
			}
		} catch (_) {}
	</script>
</head>

<body>
	<div id="ws-status" data-overlay="🎆 Fireworks">Disconnected</div>
	<div class="container">
		<div class="loading-init">
			<div class="loading-init__header"></div>
			<div class="loading-init__status"></div>
		</div>
		<div class="stage-container remove">
			<div class="canvas-container">
				<canvas id="trails-canvas"></canvas>
				<canvas id="main-canvas"></canvas>
			</div>
		</div>
	</div>
	<script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/Stage%400.1.4.js'></script>
	<script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/MyMath.js'></script>
	<script src="js/reconnecting-websocket/reconnectingWS.min.js"></script>
	<script src="js/ws-client.js"></script>
	<script src="js/ws-status.js"></script>
	<script>
		const cacheBust = new URLSearchParams(window.location.search).get('_cb') || Date.now().toString();
		function loadScript(source) {
			return new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = source + '?v=' + encodeURIComponent(cacheBust);
				script.onload = resolve;
				script.onerror = reject;
				document.head.appendChild(script);
			});
		}
		loadScript('js/fireworks-event-handler.js')
			.then(() => loadScript('js/fireworks.js'))
			.catch(error => console.error('Failed to load Fireworks scripts', error));
	</script>

</body>

</html>
