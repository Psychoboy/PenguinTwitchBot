<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plinko Bounce Overlay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@500;700&display=swap">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Fredoka', 'Rubik', sans-serif;
            user-select: none;
        }

        #plinko-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            pointer-events: none;
        }

        #ws-status {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            color: #fff;
            background: #c0392b;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 9999;
        }

        #ws-status.connected {
            background: #27ae60;
        }

        #ws-status.hidden {
            opacity: 0;
        }
    </style>
    <script src="js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script src="js/ws-client.js"></script>
    <script src="js/ws-status.js"></script>
    <script>
        const cacheBust = new URLSearchParams(window.location.search).get('_cb') || Date.now().toString();
        const script = document.createElement('script');
        script.src = 'js/plinko.js?v=' + encodeURIComponent(cacheBust);
        document.head.appendChild(script);
    </script>
</head>
<body>
    <div id="ws-status" data-overlay="🪙 Plinko Bounce">Disconnected</div>
    <canvas id="plinko-canvas"></canvas>
</body>
</html>
