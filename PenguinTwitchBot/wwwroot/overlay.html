<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
        }

        #overlay-canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        .overlay-widget {
            position: absolute;
            border: none;
            background: transparent;
            overflow: hidden;
        }

        #overlay-error {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(180, 0, 0, 0.85);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 0.85em;
            z-index: 99999;
            pointer-events: none;
        }
    </style>
    <script src="/js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script src="/js/ws-client.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const layoutName = (params.get('layout') || '').toLowerCase();
            const overlayKey = params.get('key') || '';
            const clientName = layoutName ? 'Overlay: ' + layoutName : 'Overlay';

            // Initialize shared compositor hub before child widget iframes load.
            // All widgets embedded in this overlay share a single WebSocket to /ws,
            // lowering traffic, socket churn, and connection limits.
            if (typeof window.OverlayHub === 'function') {
                window.__overlayCompositorHub = new window.OverlayHub({
                    clientName: clientName,
                    overlayKey: overlayKey,
                    layoutName: layoutName,
                    topics: [window.WS_TOPICS ? window.WS_TOPICS.overlay : 'overlay']
                });
            }

            function handleReload(msg) {
                if (!msg) return;
                const target = (msg.layout || '').toLowerCase();
                if (!target || target === layoutName) {
                    location.reload();
                }
            }

            // Listen for reload events over the websocket
            const ws = createWsSocket(clientName, [window.WS_TOPICS ? window.WS_TOPICS.overlay : 'overlay']);
            ws.addEventListener('message', function (event) {
                try {
                    const raw = event.data;
                    if (raw === 'ping') {
                        try { ws.send('pong'); } catch (_) {}
                        return;
                    }
                    const msg = JSON.parse(raw);
                    if (msg.type === 'overlay_reload') {
                        handleReload(msg);
                    }
                } catch (_) {}
            });

            // Listen for direct inter-widget reload requests via OverlayBus
            if (window.OverlayBus) {
                window.OverlayBus.on('overlay_reload', handleReload);
            }
        }());
    </script>
</head>
<body>
    <div id="overlay-canvas"></div>
    <div id="overlay-error"></div>

    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const layoutName = params.get('layout') || '';
            const overlayKey = params.get('key') || '';
            const cacheBust = Date.now().toString();
            const apiUrl = new URL('/api/overlay/config', window.location.origin);
            if (layoutName) {
                apiUrl.searchParams.set('layout', layoutName);
            }
            if (overlayKey) {
                apiUrl.searchParams.set('key', overlayKey);
            }
            apiUrl.searchParams.set('_cb', cacheBust);

            try {
                const resp = await fetch(apiUrl, { cache: 'no-store' });
                if (!resp.ok) {
                    showError('Overlay config request failed: ' + resp.status);
                    return;
                }

                const data = await resp.json();
                const canvas = document.getElementById('overlay-canvas');

                // Apply canvas dimensions from config
                const cw = data.canvasWidth  || 1920;
                const ch = data.canvasHeight || 1080;
                document.documentElement.style.width  = cw + 'px';
                document.documentElement.style.height = ch + 'px';
                document.body.style.width  = cw + 'px';
                document.body.style.height = ch + 'px';
                canvas.style.width  = cw + 'px';
                canvas.style.height = ch + 'px';

                const enabledWidgets = data.widgets
                    .filter(w => w.isEnabled)
                    .sort((a, b) => a.zIndex - b.zIndex);

                for (const w of enabledWidgets) {
                    const iframe = document.createElement('iframe');
                    iframe.src = withCacheBustAndKey(w.sourcePath, cacheBust, overlayKey);
                    iframe.className = 'overlay-widget';
                    iframe.style.left   = w.x + 'px';
                    iframe.style.top    = w.y + 'px';
                    iframe.style.width  = w.width + 'px';
                    iframe.style.height = w.height + 'px';
                    iframe.style.zIndex = w.zIndex;
                    iframe.setAttribute('allowtransparency', 'true');
                    iframe.setAttribute('frameborder', '0');
                    iframe.setAttribute('scrolling', 'no');
                    canvas.appendChild(iframe);
                }
            } catch (e) {
                showError('Failed to load overlay: ' + e.message);
                console.error(e);
            }
        })();

        function showError(msg) {
            const el = document.getElementById('overlay-error');
            if (el) {
                el.textContent = msg;
                el.style.display = 'block';
            }
        }

        function withCacheBustAndKey(sourcePath, cacheBust, key) {
            const url = new URL(sourcePath, window.location.origin);
            url.searchParams.set('_cb', cacheBust);
            if (key) {
                url.searchParams.set('key', key);
            }
            return url.origin === window.location.origin
                ? url.pathname + url.search + url.hash
                : url.toString();
        }
    </script>
</body>
</html>
