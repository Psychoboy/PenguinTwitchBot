<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Fishing</title>
    <style>
        :root {
            --text-color: #fff;
            --background-color: #000;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            display: block;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #fishing-alert {
            text-align: center;
            color: var(--text-color);
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #fishing-alert.show {
            opacity: 1;
        }

        .content {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 14px;
            display: inline-block;
            width: min(92vw, 92vh);
            max-width: calc(100vw - 48px);
            max-height: calc(100vh - 48px);
            box-sizing: border-box;
            overflow: hidden;
        }

        .username {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            font-weight: bold;
            margin-bottom: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .fish-image {
            width: min(24vw, 24vh, 150px);
            height: auto;
            max-width: min(100%, 180px);
            max-height: min(32vh, 180px);
            aspect-ratio: 1 / 1;
            object-fit: contain;
            margin: 6px auto;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .fish-name {
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: nowrap;
        }

        .middle-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2px;
        }

        .rarity {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: clamp(0.8rem, 1.4vw, 1rem);
            font-weight: bold;
            text-transform: uppercase;
        }

        .rarity.common { background: #808080; }
        .rarity.uncommon { background: #4CAF50; }
        .rarity.rare { background: #2196F3; }
        .rarity.epic { background: #9C27B0; }
        .rarity.legendary { background: linear-gradient(45deg, #FFD700, #FFA500); animation: legendary-glow 2s infinite; }
        .rarity.accident {
            background: linear-gradient(135deg, #8b1e1e, #d35400);
            box-shadow: 0 0 18px rgba(211, 84, 0, 0.45);
        }

        @keyframes legendary-glow {
            0%, 100% { box-shadow: 0 0 20px #FFD700; }
            50% { box-shadow: 0 0 40px #FFA500; }
        }

        .stars {
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            line-height: 1;
        }

        .star {
            color: #FFD700;
            text-shadow: 0 0 5px #FFA500;
            margin: 0 3px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: clamp(0.75rem, 1.2vw, 0.95rem);
            font-weight: bold;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
            min-width: 0;
        }

        .gold {
            color: #FFD700;
        }

        #ws-status {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            color: #fff;
            background: #c0392b;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 9999;
        }

        #ws-status.connected {
            background: #27ae60;
        }

        #ws-status.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="ws-status" data-overlay="🎣 Fishing">Disconnected</div>
    <div class="container">
        <div id="fishing-alert" style="display: none;">
            <div class="content">
                <div class="username" id="username"></div>
                <img class="fish-image" id="fish-image" alt="Fish" style="display: none;" />
                <div class="fish-name" id="fish-name"></div>
                <div class="middle-section">
                    <div class="rarity" id="rarity"></div>
                    <div class="stars" id="stars"></div>
                    <div class="info-row">
                        <div class="stat-item" id="weight"></div>
                        <div class="stat-item gold" id="gold"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha384-i61gTtaoovXtAbKjo903+O55Jkn2+RtzHtvNez+yI49HAASvznhe9sZyjaSHTau9" crossorigin="anonymous"></script>
    <script src="js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script src="js/ws-status.js"></script>
    <script src="js/fishing.js" asp-append-version="true"></script>
</body>
</html>
