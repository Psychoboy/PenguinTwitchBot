<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFO Claw</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
    <style>
        :root { font-family: Rubik, sans-serif; letter-spacing: 0; background: transparent; }
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        .stage { position: absolute; inset: 0; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        [hidden] { display: none !important; }
        .result { position: absolute; top: 46%; left: 15%; width: 70%; text-align: center; font-size: 38px; line-height: 1.2; font-weight: 700; color: #fff1b8; text-shadow: 0 3px 8px #10171c; overflow-wrap: anywhere; max-height: 24%; overflow: hidden; transition: left 420ms ease, width 420ms ease; }
        #ws-status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px; font-size: 14px; color: #fff; background: #a12b2b; z-index: 10; }
        #ws-status.connected { background: #23724d; }
        #ws-status.hidden { opacity: 0; pointer-events: none; }
        @media (max-width: 700px) { .result { font-size: 18px; } }
    </style>
    <script src="js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script src="js/ws-client.js"></script>
    <script src="js/ws-status.js"></script>
    <script>
        try {
            if (((window.parent && window.parent !== window) || new URLSearchParams(window.location.search).get('shared') === '1') && !window.__overlayCompositorHub) {
                var s = document.createElement('style');
                s.textContent = '#ws-status, #counter-status, #timer-status { display: none !important; }';
                document.head.appendChild(s);
            }
        } catch (_) {}
    </script>
    <script src="js/ufo.js" defer></script>
</head>
<body>
    <div id="ws-status" data-overlay="UFO Claw">Disconnected</div>
    <main class="stage">
        <canvas id="claw-scene" width="1920" height="1080" role="img" aria-label="UFO mechanical claw above a pit of prizes"></canvas>
        <div class="result" id="result" role="status" hidden></div>
    </main>
</body>
</html>
