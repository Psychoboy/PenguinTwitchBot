<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Timer Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            overflow: hidden;
        }

        #timer-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--timer-bg, transparent);
            border-radius: var(--timer-radius, 0px);
            padding: var(--timer-padding, 0px);
        }

        #timer-container.hidden {
            display: none;
        }

        #timer-status {
            position: fixed;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 10px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            background: #c0392b;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 9999;
        }

        #timer-status.connected { background: #27ae60; }
        #timer-status.hidden    { opacity: 0; }

        #timer-text {
            font-family: var(--timer-font-family, "Segoe UI", sans-serif);
            font-size: var(--timer-font-size, 72px);
            font-weight: var(--timer-font-weight, 700);
            color: var(--timer-color, #000000);
            text-shadow: var(--timer-text-shadow, none);
            letter-spacing: var(--timer-letter-spacing, 0px);
            white-space: nowrap;
            line-height: 1.1;
        }
    </style>
</head>
<body>
    <div id="timer-container">
        <span id="timer-text">00:00</span>
    </div>
    <div id="timer-status">Timer: connecting...</div>

    <script src="/js/signalr/dist/browser/signalr.js"></script>
    <script src="/js/timer-overlay.js"></script>
</body>
</html>
