<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starship Expedition Event</title>
    <link rel="stylesheet" href="/css/starship-overlay.css" />
</head>
<body data-starship-view="event">
    <div id="ws-status" data-overlay="Starship Event">Disconnected</div>
    <div id="stage">
    <main id="starship-widget" class="event-widget" hidden>
        <header class="widget-header">
            <div class="identity">
                <span id="event-kicker" class="eyebrow">CREW TRANSMISSION</span>
                <h1 id="event-title">Starship Expedition</h1>
            </div>
            <span id="event-timer" class="countdown">--:--</span>
        </header>
        <p id="event-description" class="event-description"></p>
        <div id="boarding-panel" class="boarding-panel" hidden>
            <span class="section-label">BOARDING WINDOW</span>
            <strong>Take your place aboard</strong>
            <span>Join before takeoff with <b>!sj</b></span>
        </div>
        <div id="event-panel" hidden>
            <span id="step-note" class="step-note" hidden></span>
            <div id="choices" class="choices"></div>
            <section id="reward-disclosure" class="reward-disclosure" hidden>
                <div class="reward-heading">
                    <span class="section-label">OUTCOME PROFILE</span>
                    <strong id="reward-point-type"></strong>
                </div>
                <span id="reward-success"></span>
                <span id="reward-scope"></span>
                <span id="reward-rarity"></span>
                <span id="reward-caps"></span>
                <span id="reward-risk" class="risk-note" hidden></span>
            </section>
            <footer class="vote-footer">
                <span id="event-sector"></span>
                <span>Vote in chat: <b>!sv &lt;number&gt;</b></span>
            </footer>
        </div>
        <div id="result-panel" class="result-panel" hidden>
            <span class="section-label">VOYAGE UPDATE</span>
            <strong id="result-choice"></strong>
            <span id="result-detail"></span>
            <div id="result-lines" class="result-lines" hidden></div>
            <div id="result-banked" class="banked-list" hidden></div>
        </div>
    </main>
    <div id="starship-toast" class="toast" hidden></div>
    </div>
    <script src="/js/reconnecting-websocket/reconnectingWS.min.js"></script>
    <script src="/js/ws-client.js"></script>
    <script src="/js/ws-status.js"></script>
    <script src="/js/starship-scene.js"></script>
    <script src="/js/starship-overlay.js"></script>
</body>
</html>
